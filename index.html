<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لحظة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--rgb:linear-gradient(90deg,#ff2d55,#ff9500,#ffe600,#34ff7a,#00d4ff,#7a5cff,#ff2d55);--conic:conic-gradient(#ff2d55,#ff9500,#ffe600,#34ff7a,#00d4ff,#7a5cff,#ff2d55);--dim:rgba(255,255,255,.62);box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
input{font:16px Cairo,sans-serif;color:#fff;background:#1a1a1a;border:0;border-radius:20px;padding:10px 14px;width:100%}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#000}
#main{flex:1;min-height:0;position:relative;overflow:hidden}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.clip{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
.stage{position:absolute;inset-inline:0;top:26%;aspect-ratio:4/3;overflow:hidden;border-block:2px solid transparent;border-image:var(--rgb) 1}
.clip.full .stage{top:0;height:100%;aspect-ratio:auto;border:0}
.sc{position:absolute;inset:-25%;animation:sway 8s ease-in-out infinite alternate;will-change:transform}
@keyframes sway{to{transform:rotate(14deg) scale(1.15)}}
.em{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px) scale(1.06)}}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;opacity:0;transition:opacity .15s;pointer-events:none}
.clip.paused .play{opacity:.9}
.clip.paused .sc,.clip.paused .em,.clip.paused .prog i,.clip:not(.on) .sc,.clip:not(.on) .em,.clip:not(.on) .prog i{animation-play-state:paused}
.fs{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);background:#1c1c1c;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;white-space:nowrap}
.clip.full .fs{display:none}
.pop{position:absolute;font-size:80px;pointer-events:none;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:1}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1.3) translateY(-30px);opacity:0}}
.info{position:absolute;inset-inline:0;bottom:12px;padding:0 16px 0 84px;z-index:2}
.info b{font-size:17px;font-weight:900;display:block}
.info p{font-size:14px;color:var(--dim);line-height:1.6}
.side{position:absolute;left:8px;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
.side button{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700}
.ic{font-size:30px;line-height:1.1;transition:transform .15s}
.off{filter:grayscale(1) brightness(2.2)}
.pulse{transform:scale(1.25)}
.av{position:relative;width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none}
.av::before{content:"";position:absolute;inset:-50%;background:var(--conic);animation:spin 3s linear infinite}
.av>span,.av>img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;background:#111;display:grid;place-items:center;font-size:24px;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{position:absolute;inset-inline:0;bottom:0;height:3px;background:#2a2a2a;z-index:4}
.prog i{display:block;height:100%;background:var(--rgb);transform-origin:right;transform:scaleX(0);animation:fill 12s linear infinite}
@keyframes fill{to{transform:scaleX(1)}}
#top{position:absolute;top:0;inset-inline:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;display:flex;justify-content:space-between;align-items:center}
#top>button{font-size:24px}
#tabs{display:flex;gap:18px}
#tabs button{font-size:17px;font-weight:700;color:var(--dim);padding:6px 2px;position:relative}
#tabs button.on{color:#fff}
#tabs button.on::after,.tb.on::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:2px;background:var(--rgb);background-size:300% 100%;animation:slide 3s linear infinite}
@keyframes slide{to{background-position:-300% 0}}
#nav{flex:none;display:flex;align-items:center;justify-content:space-around;background:#000;border-top:1px solid #1d1d1d;padding:8px 2px calc(8px + env(safe-area-inset-bottom,0px))}
#nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;color:var(--dim);min-width:58px}
#nav .e{font-size:24px}
#nav button.on{color:#fff}
#nav button:not(.on) .e{opacity:.7}
#nav .plus{position:relative;width:52px;height:36px;border-radius:12px;overflow:hidden;min-width:0}
#nav .plus::before{content:"";position:absolute;inset:-100%;background:var(--conic);animation:spin 3s linear infinite}
#nav .plus span{position:absolute;inset:3px;border-radius:10px;background:#fff;color:#000;display:grid;place-items:center;font-size:22px;font-weight:900}
#view{position:absolute;inset:0;background:#000;overflow-y:auto;display:none;z-index:8;padding-top:env(safe-area-inset-top,0px)}
#view.show{display:block}
.empty{min-height:60%;display:grid;place-items:center;text-align:center;padding:30px;color:var(--dim);line-height:1.9}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}.row .t small{color:var(--dim);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:11px;font-style:normal;color:#fff;margin-inline-start:4px;vertical-align:middle}
.vb.ab{background:#9a9a9a;font-weight:900}.cmt{display:flex;gap:8px;align-items:flex-start}.cmt .b{flex:1;min-width:0}.cmt .nm{font-size:12px;font-style:normal;color:var(--dim)}.cmt .rb{background:none;border:0;padding:0 8px 0 0;margin-top:2px;font-size:12px;color:var(--dim)}.rps{margin-inline-start:40px;display:flex;flex-direction:column;gap:8px}.fl{display:flex;gap:8px;align-items:center;color:inherit;text-decoration:none}.vb.red{background:#ff2d55}.vb.blue{background:#1da1f2}.vb.purple{background:#a259ff}
.pri{background:#ff2d55;border-radius:20px;padding:8px 20px;font-weight:700;font-size:14px}
.sec{background:#222;border-radius:20px;padding:8px 20px;font-weight:700;font-size:14px}
.ban{height:190px;position:relative;overflow:hidden;background:linear-gradient(120deg,#1d0b3b,#0b3b4a,#3b0b2d)}
.ban::before{content:"";position:absolute;inset:-60%;background:radial-gradient(circle at 30% 40%,rgba(122,92,255,.55),transparent 35%),radial-gradient(circle at 70% 60%,rgba(0,212,255,.45),transparent 35%),radial-gradient(circle at 50% 20%,rgba(255,45,85,.4),transparent 30%);animation:spin 18s linear infinite}
.ban video,.ban .bi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center}
.ban::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--rgb);background-size:300% 100%;animation:slide 3s linear infinite}
.ph{display:flex;gap:14px;align-items:flex-end;padding:0 16px;margin-top:-34px;position:relative}
.ph .av{width:84px;height:84px}
.ph .av>span,.ph .av>img{font-size:38px}
.stats{display:flex;gap:22px;padding:10px 16px;text-align:center}
.stats b{display:block;font-size:18px}.stats small{color:var(--dim);font-size:12px}
.tbs{display:flex;border-block:1px solid #1d1d1d;margin-top:8px}
.tb{flex:1;padding:10px 0;font-size:22px;position:relative}
.tb:not(.on){color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{aspect-ratio:3/4;position:relative;display:grid;place-items:center;font-size:44px;overflow:hidden}
.tile small{position:absolute;bottom:4px;inset-inline-start:6px;font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#1a1a1a;border-radius:16px;padding:5px 12px;font-size:13px}
.ch{display:flex;flex-direction:column;height:100%}
.chh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1d1d1d}
.chh>button{font-size:20px}
#ml{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background-size:cover;background-position:center}
.m{max-width:78%;padding:8px 12px;border-radius:var(--br,16px);font-size:14px;line-height:1.6;word-break:break-word}
.m.me{align-self:flex-start;background:var(--bm,#7a5cff)}.m.th{align-self:flex-end;background:#242424}
.m img{max-width:100%;border-radius:10px;display:block}
.cb{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #1d1d1d}
.cb>button{font-size:24px}
.cb .note{flex:1;text-align:center;color:var(--dim);font-size:13px}
#sheet,#modal .box{background:#161616;border-top:2px solid transparent;border-image:var(--rgb) 1}
#sheet{position:absolute;inset-inline:0;bottom:0;z-index:20;border-radius:20px 20px 0 0;padding:16px;max-height:62%;display:none;flex-direction:column;gap:10px}
#sheet.open{display:flex}
#list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:14px}
#list span{color:var(--dim)}
#cform{display:flex;gap:8px}
#modal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
#modal.show{display:flex}
#modal .box{width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#262626;border-radius:20px;padding:8px 18px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
#app{position:relative}
.aur{position:absolute;inset:-30%;background:radial-gradient(circle at 20% 30%,rgba(122,92,255,.38),transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,212,255,.3),transparent 40%),radial-gradient(circle at 50% 95%,rgba(255,45,85,.32),transparent 40%);animation:spin 28s linear infinite;will-change:transform}
.clip:not(.on) .aur{animation-play-state:paused}
.stage video,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ic{filter:drop-shadow(0 0 7px rgba(255,255,255,.35))}
.ic.off{filter:none}.sv .ic:not(.off){color:#ffd60a}.rp .ic:not(.off){color:#34ff7a}.ic.k{color:#ff2d55}
#nav{background:rgba(8,8,14,.94);border-top:1px solid transparent;border-image:var(--rgb) 1}
#tabs button.on{background:var(--rgb);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 3s linear infinite}
.hint{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;z-index:1;pointer-events:none}
.emo{display:flex;gap:8px;font-size:24px;overflow-x:auto}.emo span{cursor:pointer}
#splash{position:absolute;inset:0;z-index:99;background:#000;display:grid;place-items:center;pointer-events:none;animation:out .6s ease 1.4s forwards}
#splash b{font-size:76px;font-weight:900;background:var(--rgb);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 1.5s linear infinite}
@keyframes out{to{opacity:0;visibility:hidden}}
.fb{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border-radius:0;background:none}
.cam{position:absolute;bottom:-2px;inset-inline-end:-2px;width:32px;height:32px;border-radius:50%;background:#222;border:2px solid #000;font-size:16px;z-index:2}
.bcam{position:absolute;top:10px;inset-inline-end:12px;background:rgba(0,0,0,.6);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;z-index:3}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}.i.f{fill:currentColor}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:0s!important;animation-iteration-count:1!important}}
select{font:16px Cairo,sans-serif;color:#fff;background:#1a1a1a;border:0;border-radius:20px;padding:10px 14px;width:100%}
.srow{display:flex;gap:10px;padding:6px 16px;overflow-x:auto}
.sth,.sadd{flex:none;width:64px;height:64px;border-radius:50%;padding:3px;background:var(--conic)}
.sth>*{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:26px;border:2px solid #000}
.sadd{background:#1a1a1a;font-size:24px;display:grid;place-items:center}
#story{position:absolute;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
#story.show{display:flex}
.sp{height:3px;background:#333;margin:calc(8px + env(safe-area-inset-top,0px)) 10px 0;border-radius:2px;overflow:hidden}
.sp i{display:block;height:100%;width:0;background:var(--rgb)}
.sb{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}
.sb img{width:100%;height:100%;object-fit:contain}
.sb .e2{position:relative;font-size:110px}
.sb p{position:absolute;inset-inline:0;bottom:16px;text-align:center;padding:0 16px;font-weight:700}
.sr{display:flex;justify-content:center;gap:12px;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));font-size:28px}
.sr button{display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.sr small{font-size:12px;min-height:16px}
#gate{position:absolute;inset:0;z-index:98;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
#gate.show{display:flex}
#gate b{font-size:64px;font-weight:900;background:var(--rgb);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 2s linear infinite}
#gate p{color:var(--dim);line-height:1.8}
#gate a{text-decoration:none;display:inline-block}
#livebox{position:absolute;inset:0;z-index:70;background:#000;display:none}#livebox.show{display:block}
#livebox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.lvt{position:absolute;top:0;inset-inline:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(#000b,transparent);z-index:2}
.lvb{background:#ff2d55;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:900;flex:none}
.lvs{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-weight:700;pointer-events:none;z-index:1;line-height:1.8}
.lvl{position:absolute;inset-inline:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-height:34%;overflow-y:auto;padding:0 12px;display:flex;flex-direction:column;gap:4px;z-index:2;font-size:14px;text-shadow:0 1px 3px #000}
.lvl b{opacity:.75}
.lvi{position:absolute;inset-inline:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:3}
.lvi button{font-size:28px}.lvi input{background:rgba(0,0,0,.55)}
.fl{position:absolute;bottom:80px;font-size:30px;animation:flo 2s ease-out forwards;pointer-events:none;z-index:3}
@keyframes flo{to{transform:translateY(-260px);opacity:0}}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
#app{height:100dvh}
button{touch-action:manipulation;transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .2s}
button:active{transform:scale(.9)}.row{transition:background .15s}.row:active{background:#141414}
#feed,#view,#list,#ml,#sheet,#modal .box,.lvl,.srow{-webkit-overflow-scrolling:touch}
.clip{contain:layout paint}
.side{gap:6px}.side .ic{font-size:27px}
#sheet{background:rgba(22,22,22,.86);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes mi{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tp{0%{transform:scale(.7)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
#modal.show{animation:fadeIn .25s ease}
#modal.show .box,#sheet.open{animation:sheetUp .42s cubic-bezier(.32,.72,0,1)}
#view.show{animation:vin .32s cubic-bezier(.22,1,.36,1)}
#story.show,#livebox.show,#gate.show{animation:fadeIn .3s ease}
.m:last-child{animation:mi .28s cubic-bezier(.22,1,.36,1)}
#nav button.on .e{animation:tp .38s cubic-bezier(.34,1.56,.64,1)}
#toast{transform:translateX(-50%) translateY(-8px) scale(.96);transition:opacity .25s,transform .38s cubic-bezier(.34,1.56,.64,1)}
#toast.show{transform:translateX(-50%) translateY(0) scale(1)}
</style>
</head>

  }catch(e){return toast('تعذّر الحذف')}
  const keep=[];for(const n of LS.g('accs',[]))if(!u.h||await sha(n)!==u.h)keep.push(n);LS.s('accs',keep);
  if(id===uid){try{keep.length?LS.s('lnum',keep[0]):localStorage.removeItem('lnum')}catch(e){}location.reload();return}
  toast('تم حذف الحساب نهائيًا');if(cur==='me')vProfile(uid)}

/* ---------- الحساب برقم لحظة + الاتصال ---------- */
let hold=0,res=0,cid0='',st2=0;
const sha=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lahza:'+x)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const genNum=()=>{const a=new Uint32Array(3);crypto.getRandomValues(a);return[...a].map(x=>String(x%10000).padStart(4,'0')).join('-')};
const normNum=x=>{const d=String(x).replace(/[^0-9]/g,'');return d.length===12?d.replace(/(\d{4})(?=\d)/g,'$1-'):''};
const stk=c=>{const t=Math.floor(Date.now()/DAY);return c&&c.sk&&c.skd>=t-1?c.sk:0};
const applyBub=(ml,id)=>{const S=LS.g('bub_'+id,{});ml.style.setProperty('--bm',S.c||'#7a5cff');ml.style.setProperty('--br',(S.r??16)+'px')};
const grow=(id,c)=>`<div class="row" data-c="${id}">${avatar({avatar:c.img},48)}<div class="t"><b>👥 ${esc(c.name)}</b><small>${esc(c.last||'مجموعة جديدة')}</small></div></div>`;
function showNum(n,next){hold=1;const g=$('#gate');g.classList.add('show');g.innerHTML=`<b>لحظة</b><p>🔑 رقم لحظة الخاص بك</p><div dir="ltr" style="font-size:28px;font-weight:900;letter-spacing:2px">${n}</div><p style="font-size:13px">احفظه جيدًا: به تدخل حسابك من أي جهاز. لا تعطه لأحد.</p><div style="width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px"><button class="sec" id="cp1">نسخ الرقم</button><button class="pri" id="ok1">حفظته ✓</button></div>`;
  $('#cp1').onclick=e=>{try{navigator.clipboard.writeText(n);e.target.textContent='✓ تم النسخ'}catch(x){e.target.textContent='انسخه يدويًا'}};$('#ok1').onclick=()=>{hold=0;next()}}
function enter(pid){uid=pid;hold=0;saveAcc(LS.g('lnum',null));$('#gate').classList.remove('show');if(!st2){st2=1;startOthers()}render();if(cur!=='home')go(cur)}
async function resolveSess(){if(uid||res||hold)return;res=1;try{
  const ln=LS.g('lnum',null);if(ln){const h=await sha(ln),f=Object.entries(users).find(([k,x])=>x.h===h);if(f)return enter(f[0])}
  if(cid0&&users[cid0]&&!users[cid0].h){const n=genNum();await db.doc('users/'+cid0).update({h:await sha(n)});LS.s('lnum',n);return showNum(n,()=>enter(cid0))}
  if(!$('#gate').classList.contains('show'))showGate()}finally{res=0}}
function newGroup(){if(!db)return toast('المجموعات تحتاج اتصالًا');const L=Object.entries(users).filter(([k])=>k!==uid);let img='';
  const b=modal(`<b>👥 مجموعة جديدة</b><label class="sec fb"><svg class="i "><use href="#i-image"/></svg> صورة المجموعة<input type="file" accept="image/*" id="gp"></label><input id="gn2" placeholder="اسم المجموعة" maxlength="30"><div>${L.length?L.map(([k,x])=>`<label class="row" style="gap:10px"><input type="checkbox" value="${esc(k)}" style="width:auto">${avatar(x,36)}<b>${uname(x)}</b></label>`).join(''):'<div class="empty" style="min-height:80px">لا مستخدمين بعد</div>'}</div><button class="pri" id="gc">إنشاء</button>`);
  b.querySelector('#gp').onchange=async e=>{const f=e.target.files[0];if(f){img=await shrink(f,160,.7);toast('تم اختيار الصورة')}};
  b.querySelector('#gc').onclick=async()=>{const n=b.querySelector('#gn2').value.trim(),m=[...b.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!n)return toast('اكتب اسم المجموعة');if(!m.length)return toast('اختر شخصًا واحدًا على الأقل');
    const id='g_'+Date.now().toString(36),c={g:1,name:n,img,m:[uid,...m],a:'',b:'',from:uid,status:'ok',last:'',lastAt:Date.now(),own:uid};
    try{await db.doc('chats/'+id).set(c);chats[id]=c;closeM();vChat({id})}catch(e){toast('تعذّر إنشاء المجموعة')}}}
function startOthers(){
  db.collection('lives').onSnapshot(s=>{lives={};s.docs.forEach(d=>lives[d.id]=d.data());liveDot();if(LV&&!LV.own&&!lives[LV.id]){toast('انتهى البث');endLive()}});
  db.collection('posts').orderBy('at','desc').limit(40).onSnapshot(s=>{const n=posts.length;posts=s.docs.map(d=>mkp(d.data(),d.id));if(cur==='home'&&posts.length!==n)render()});
  db.collection('likes').limit(2000).onSnapshot(s=>{LK.c={};LK.m={};s.docs.forEach(d=>{const x=d.data();LK.c[x.p]=(LK.c[x.p]||0)+1;if(x.u===uid)LK.m[x.p]=1});syncP()});
  db.collection('comments').orderBy('at','asc').limit(800).onSnapshot(s=>{for(const k in CM)delete CM[k];s.docs.forEach(d=>{const x=d.data();(CM[x.p]=CM[x.p]||[]).push({...x,cid:d.id})});syncP()});
  db.collection('stories').orderBy('at','desc').limit(60).onSnapshot(s=>{stories=s.docs.map(d=>{const x=d.data(),r={};Object.keys(x).forEach(k=>k.startsWith('r_')&&(r[k.slice(2)]=x[k]));return{...x,id:d.id,db:1,r}});if(cur==='me'&&pv&&!$('#story').classList.contains('show'))vProfile(pv)});
  db.collection('data/users/'+uid).onSnapshot(s=>{myPriv=s.docs.map(d=>mkp(d.data(),d.id))});
  [['a','=='],['b','=='],['m','array-contains']].forEach(([f,op])=>db.collection('chats').where(f,op,uid).onSnapshot(s=>{
    s.docChanges().forEach(ch=>{const d=ch.doc.data(),id=ch.doc.id;
      if(ch.type==='removed'){delete chats[id];return}
      if(ch.type==='modified'&&d.from!==uid&&curChat!==id&&(d.lastAt||0)>started)toast('💬 '+((users[d.from]||{}).name||'رسالة جديدة')+': '+(d.last||'طلب محادثة'));
      chats[id]=d});
    if(cur==='inbox')vInbox();if(curChat&&window._bar)window._bar()}))}
(async()=>{
  U=await use('user');db=await use('db');R=await use('room');
  if(!db){db=null;local=true;uid='local';{const sv0=LS.g('lp',null);users.local=sv0||{name:'أنا',username:'me',following:[],bonus:0,nameAt:0,userAt:0};if(!sv0)showGate()}return}
  try{cid0=U?await U.id():''}catch(e){}
  db.collection('users').limit(300).onSnapshot(s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());if(!uid){resolveSess();return}
    if(['friends','me'].includes(cur)&&!(document.activeElement&&document.activeElement.closest('#view')))(cur==='me'&&pv&&pv!==uid?vProfile(pv):go(cur))});
})();
render();
</script>
